<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LR-12 · As Authored</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#f6f1e7; }
#container { width:100%; height:100%; }
#badge { position:fixed; left:14px; bottom:12px; z-index:10; font-family:'Segoe UI',sans-serif; font-size:11px; color:#8a8170; letter-spacing:.04em; }
</style>
</head>
<body>
<div id="container"></div>
<div id="badge">LR-12 · exact GLB · no material changes</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

const container = document.getElementById('container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf6f1e7);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.0;

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dir = new THREE.DirectionalLight(0xffffff, 2.2);
dir.position.set(5, 8, 6);
scene.add(dir);
const dir2 = new THREE.DirectionalLight(0xffffff, 0.9);
dir2.position.set(-4, 3, -5);
scene.add(dir2);

let envDone = false;
new RGBELoader().load('./assets/env_metal_001.hdr', (tex) => {
  const pmrem = new THREE.PMREMGenerator(renderer);
  const rt = pmrem.fromEquirectangular(tex);
  scene.environment = rt.texture;
  envDone = true;
}, undefined, () => {});

new GLTFLoader().load('./assets/LR-12.glb', (gltf) => {
  const model = gltf.scene;
  if (!envDone) {
    try {
      model.traverse((o) => {
        if (o.isMesh) (o.material || []).forEach && (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => { m.envMapIntensity = Math.max(m.envMapIntensity || 0, 1); });
      });
    } catch (e) {}
  }
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  model.position.x -= center.x;
  model.position.y -= box.min.y;
  model.position.z -= center.z;
  const maxDim = Math.max(size.x, size.y, size.z);
  camera.position.set(0, size.y * 0.3, maxDim * 2.1);
  camera.lookAt(0, size.y * 0.3, 0);
  controls.target.set(0, size.y * 0.3, 0);
  scene.add(model);
  window.__raw12 = model;
}, (xhr) => {}, (err) => console.error(err));

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
