<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Ring Spin Viewer — rotate the RING (static camera)</title><style>:root{--ivory:#f4f4eb;--ink:#2b2620;--gold:#c5ad6d}*{margin:0;padding:0;box-sizing:border-box}body,html{height:100%;background:var(--ivory);color:var(--ink);font-family:Segoe UI,Arial,sans-serif;overflow:hidden}#webgi-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--ivory);transition:opacity .5s ease}#loader.hidden{opacity:0;pointer-events:none}.msg{font-size:14px;letter-spacing:.2em;color:var(--gold);margin-bottom:8px}.sub{font-size:11px;color:#8f7a60;letter-spacing:.12em}#err{position:fixed;inset:0;z-index:99;display:none;padding:40px;background:#fdf6ec;color:#b00020;font-size:13px;white-space:pre-wrap}#hint{bottom:26px;left:50%;transform:translateX(-50%);z-index:10;letter-spacing:.22em;color:#8f7a60;background:hsla(0,0%,100%,.7);padding:10px 22px;border-radius:999px;border:1px solid #e6ddcd;pointer-events:none}#hint,#spin-btn{position:fixed;font-size:11px;text-transform:uppercase}#spin-btn{right:24px;bottom:24px;z-index:20;border:none;cursor:pointer;background:var(--ink);color:var(--ivory);letter-spacing:.2em;padding:13px 20px;border-radius:4px}#spin-btn.on{background:var(--gold)}</style></head><body> <canvas id="webgi-canvas"></canvas> <div id="loader"> <div class="msg">SPIN VIEWER</div> <div class="sub">Drag to rotate the ring</div> </div> <div id="err"></div> <div id="hint">Drag to explore your ring</div> <button id="spin-btn" title="Toggle auto-rotate">Auto Rotate</button> <script src="spin-viewer.b28c70bc.js"></script> </body></html>
